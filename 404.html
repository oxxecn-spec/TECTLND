<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Page Not Found — MBORMC Custom Screens</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://www.mbormc.com/">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #ffffff;
            color: #1a2c3e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 680px;
            width: 100%;
            text-align: center;
            padding: clamp(30px, 5vw, 60px);
        }
        .error-code {
            font-size: clamp(80px, 15vw, 160px);
            font-weight: 800;
            color: #1a2c3e;
            line-height: 1;
            letter-spacing: -4px;
        }
        .error-code span {
            color: #2c7a4d;
        }
        .icon-large {
            font-size: clamp(60px, 10vw, 100px);
            color: #2c7a4d;
            margin: 10px 0 20px;
            display: inline-block;
        }
        h1 {
            font-size: clamp(24px, 3.5vw, 36px);
            font-weight: 700;
            color: #1a2c3e;
            margin-bottom: 12px;
        }
        p {
            font-size: clamp(16px, 1.2vw, 20px);
            color: #4a6272;
            line-height: 1.7;
            margin-bottom: 24px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 36px;
            background-color: #2c7a4d;
            color: #fff;
            border-radius: 40px;
            font-weight: 600;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            min-height: 48px;
        }
        .btn:hover {
            background-color: #1f5a38;
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(44, 122, 77, 0.3);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #2c7a4d;
            color: #2c7a4d;
        }
        .btn-outline:hover {
            background: #2c7a4d;
            color: #fff;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .countdown {
            font-size: clamp(14px, 1vw, 16px);
            color: #7a8e9c;
            margin-top: 20px;
        }
        .countdown strong {
            color: #2c7a4d;
            font-size: clamp(18px, 1.2vw, 22px);
        }
        .divider {
            width: 60px;
            height: 3px;
            background: #2c7a4d;
            border-radius: 2px;
            margin: 16px auto 20px;
        }
        .brand {
            font-size: 14px;
            color: #7a8e9c;
            margin-top: 30px;
        }
        .brand strong {
            color: #1a2c3e;
        }
        .brand a {
            color: #2c7a4d;
            font-weight: 600;
            text-decoration: none;
        }
        .brand a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container { padding: 20px; }
            .btn { padding: 12px 24px; font-size: 14px; min-height: 44px; width: 100%; justify-content: center; }
            .btn-group { flex-direction: column; align-items: center; }
            .btn-group .btn { width: 100%; max-width: 300px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 404 图标 -->
        <div class="icon-large"><i class="fas fa-compass"></i></div>

        <!-- 404 代码 -->
        <div class="error-code">4<span>0</span>4</div>

        <!-- 标题 -->
        <h1>Page Not Found</h1>

        <!-- 分隔线 -->
        <div class="divider"></div>

        <!-- 描述 -->
        <p>Oops! The page you're looking for doesn't exist or has been moved. We'll redirect you to our homepage in <strong id="countdownNumber">3</strong> seconds.</p>

        <!-- 按钮组 -->
        <div class="btn-group">
            <a href="https://www.mbormc.com/" class="btn"><i class="fas fa-home"></i> Go to Homepage</a>
            <a href="https://www.mbormc.com/contact" class="btn btn-outline"><i class="fas fa-envelope"></i> Contact Us</a>
        </div>

        <!-- 倒计时 -->
        <div class="countdown">
            <i class="fas fa-arrow-right" style="color: #2c7a4d; margin-right: 6px;"></i>
            Redirecting in <strong id="countdownDisplay">3</strong> seconds...
        </div>

        <!-- 品牌 -->
        <div class="brand">
            <strong>MBORMC</strong> — Custom Mosquito Screens &amp; Pet-Proof Doors
            <br>
            <a href="https://www.mbormc.com/">www.mbormc.com</a>
        </div>
    </div>

    <script>
        // ===== 3秒倒计时自动跳转 =====
        (function() {
            let seconds = 3;
            const countdownDisplay = document.getElementById('countdownDisplay');
            const countdownNumber = document.getElementById('countdownNumber');

            function updateDisplay() {
                if (countdownDisplay) countdownDisplay.textContent = seconds;
                if (countdownNumber) countdownNumber.textContent = seconds;
            }

            updateDisplay();

            const timer = setInterval(function() {
                seconds -= 1;
                updateDisplay();

                if (seconds <= 0) {
                    clearInterval(timer);
                    window.location.href = 'https://www.mbormc.com/';
                }
            }, 1000);

            // 如果用户点击任何按钮，清除定时器（防止跳转干扰用户操作）
            document.querySelectorAll('.btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    clearInterval(timer);
                });
            });
        })();
    </script>

</body>
</html>
