<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PI 報價單生成器 · MBORMC 曼伯歐羅</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #e6e9ef;
            font-family: 'Microsoft JhengHei', 'PingFang TC', 'Segoe UI', Arial, sans-serif;
            padding: 30px 20px;
        }
        .container { max-width: 1300px; margin: 0 auto; }

        /* ===== 表單區域 ===== */
        .form-panel {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            padding: 28px 32px;
            margin-bottom: 24px;
        }
        .form-panel h2 {
            font-size: 20px;
            color: #0b1a33;
            margin-bottom: 18px;
            border-bottom: 2px solid #1a2b4c;
            padding-bottom: 10px;
        }
        .form-panel h3 {
            font-size: 15px;
            color: #0b1a33;
            margin: 18px 0 8px;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px 20px;
            margin-bottom: 14px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: #5d708b;
            letter-spacing: 0.3px;
        }
        .form-group input, .form-group select {
            padding: 8px 10px;
            border: 1px solid #dce5ec;
            border-radius: 8px;
            font-size: 14px;
            color: #1b293b;
            transition: border 0.2s;
            font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #1e5a8a;
            box-shadow: 0 0 0 3px rgba(30,90,138,0.1);
        }
        .form-group input[readonly] {
            background: #f4f7fc;
            color: #1e5a8a;
            font-weight: 600;
            cursor: not-allowed;
        }

        /* ===== 產品卡片 ===== */
        .product-card {
            background: #f8fafd;
            border: 1px solid #e3e9f2;
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 14px;
            position: relative;
        }
        .product-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .product-card .card-title {
            font-size: 14px;
            font-weight: 600;
            color: #1e5a8a;
        }
        .product-card .row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px 14px;
            margin-bottom: 8px;
        }
        .product-card .row:last-child { margin-bottom: 0; }
        .product-card .form-group label { font-size: 11px; }
        .product-card .form-group input,
        .product-card .form-group select { padding: 6px 8px; font-size: 13px; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-primary { background: #1e5a8a; color: white; }
        .btn-primary:hover { background: #0f3b5c; transform: translateY(-1px); }
        .btn-outline {
            background: white;
            border: 1.5px solid #1e5a8a;
            color: #1e5a8a;
        }
        .btn-outline:hover { background: #1e5a8a; color: white; }
        .btn-danger {
            background: #e74c3c;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
        }
        .btn-danger:hover { background: #c0392b; }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        /* ===== 匯率狀態提示 ===== */
        .rate-status {
            font-size: 12px;
            padding: 8px 14px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: inline-block;
        }
        .rate-status.loading { background: #e3f2fd; color: #1565c0; }
        .rate-status.success { background: #e8f5e9; color: #2e7d32; }
        .rate-status.fail { background: #fff3e0; color: #e65100; }

        /* ===== PI 輸出區域 ===== */
        .quote-output {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            padding: 45px 50px;
            display: none;
        }
        .quote-output.show { display: block; }

        .brand-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 3px solid #1a2b4c;
            padding-bottom: 16px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }
        .brand-left { display: flex; flex-direction: column; }
        .brand-name {
            font-size: 28px;
            font-weight: 700;
            color: #0b1a33;
            letter-spacing: 1px;
        }
        .brand-name small { font-weight: 400; font-size: 14px; color: #3d4f6a; margin-left: 10px; }
        .brand-tagline {
            font-size: 13px;
            color: #3d5a73;
            background: #eaf3ed;
            display: inline-block;
            padding: 2px 14px;
            border-radius: 30px;
            margin-top: 4px;
        }
        .invoice-meta {
            text-align: right;
            background: #f4f7fc;
            padding: 10px 18px;
            border-radius: 16px;
        }
        .invoice-meta div { font-size: 14px; color: #1f2a3f; line-height: 1.6; }
        .invoice-meta strong { font-weight: 600; color: #0b1a33; }

        .address-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 30px 40px;
            background: #f9fafc;
            padding: 18px 22px;
            border-radius: 18px;
            margin-bottom: 24px;
            border: 1px solid #e9edf4;
        }
        .address-box { flex: 1 1 200px; }
        .address-box .label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.8px;
            color: #5d708b;
            margin-bottom: 5px;
        }
        .address-box .content { font-size: 15px; line-height: 1.6; color: #1b293b; }
        .address-box .content .phone { font-weight: 500; color: #0f2b4f; }
        .web-link { color: #0059b3; text-decoration: none; border-bottom: 1px dotted #b3c9e0; }

        .table-wrap { overflow-x: auto; margin: 18px 0 20px; border-radius: 16px; border: 1px solid #e3e9f2; }
        table { width: 100%; border-collapse: collapse; font-size: 12.5px; background: white; min-width: 950px; }
        th {
            background: #1a2b4c;
            color: white;
            font-weight: 600;
            padding: 10px 8px;
            text-align: center;
            font-size: 11.5px;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        td { padding: 10px 8px; border-bottom: 1px solid #eef2f8; text-align: center; vertical-align: middle; background: white; }
        tr:last-child td { border-bottom: none; }
        .text-left { text-align: left; padding-left: 12px; }
        .bg-total { background: #e9eff9; font-weight: 700; font-size: 16px; }
        .bg-sub { background: #f8f9fa; }
        .en-cell { font-size: 10px; color: #4f6a8a; display: block; margin-top: 2px; }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 30px;
            background: #f8fafd;
            padding: 18px 22px;
            border-radius: 18px;
            margin: 18px 0 16px;
            border: 1px solid #e6ecf5;
        }
        .info-item { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-size: 14px; line-height: 1.6; }
        .info-item .tag { font-weight: 600; color: #26436a; min-width: 140px; }

        /* ===== 多幣種顯示框 ===== */
        .currency-box {
            background: #f0f7ff;
            border: 2px solid #b8d4e8;
            border-radius: 16px;
            padding: 20px 24px;
            margin: 18px 0;
        }
        .currency-box .title {
            font-size: 15px;
            font-weight: 700;
            color: #003d7a;
            margin-bottom: 14px;
            letter-spacing: 0.5px;
        }
        .currency-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px 24px;
        }
        .currency-item {
            background: #ffffff;
            border: 1px solid #dce9f5;
            border-radius: 12px;
            padding: 12px 16px;
            text-align: center;
        }
        .currency-item .c-label {
            font-size: 12px;
            color: #5d708b;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .currency-item .c-value {
            font-size: 20px;
            font-weight: 700;
            color: #003d7a;
        }
        .currency-item.main .c-value {
            color: #b8860b;
            font-size: 22px;
        }
        .currency-note {
            margin-top: 14px;
            font-size: 12px;
            color: #856404;
            background: #fff8e1;
            border: 1px solid #ffc107;
            border-radius: 10px;
            padding: 10px 14px;
            line-height: 1.7;
        }

        .terms-box {
            background: #f2f6fe;
            border-left: 5px solid #1a2b4c;
            padding: 16px 22px;
            border-radius: 14px;
            margin: 20px 0 16px;
            font-size: 14px;
            line-height: 1.8;
            color: #0f263f;
        }
        .terms-box strong { color: #002856; }

        /* ===== 資金來源與合規聲明（精簡版）===== */
        .compliance-box {
            background: #fff5f5;
            border: 2px solid #e74c3c;
            border-radius: 14px;
            padding: 14px 20px;
            margin: 18px 0 14px;
            font-size: 12.5px;
            line-height: 1.8;
            color: #7a1f1f;
        }
        .compliance-box .box-title {
            font-size: 14px;
            font-weight: 700;
            color: #c0392b;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }
        .compliance-box .box-note {
            background: #fff0f0;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 10px;
            font-size: 12px;
            color: #a05252;
            line-height: 1.7;
        }
        .compliance-box p {
            margin-bottom: 6px;
        }

        .sign-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            margin: 28px 0 10px;
            padding-top: 12px;
            border-top: 2px solid #dfe7f2;
        }
        .sign-box { min-width: 180px; padding: 6px 0; }
        .sign-box .label { font-size: 13px; color: #475e7c; font-weight: 500; }
        .sign-box .name { font-size: 18px; font-weight: 600; color: #0b1a33; margin-top: 4px; border-bottom: 1px solid #bacfe0; padding-bottom: 6px; display: inline-block; }
        .sign-box .date { font-size: 14px; color: #2e4a6b; margin-top: 8px; }

        .footer-note {
            text-align: center;
            font-size: 13px;
            color: #4f688b;
            margin-top: 18px;
            border-top: 1px solid #e2eaf5;
            padding-top: 16px;
        }

        @media (max-width: 768px) {
            .product-card .row { grid-template-columns: 1fr 1fr; }
            .quote-output { padding: 20px 18px; }
            .brand-row { flex-direction: column; align-items: flex-start; gap: 10px; }
            .invoice-meta { text-align: left; width: 100%; }
            .info-grid { grid-template-columns: 1fr; }
            .sign-row { flex-direction: column; gap: 16px; }
        }

        @media print {
            body { background: white; padding: 0; }
            .form-panel { display: none !important; }
            .quote-output { display: block !important; box-shadow: none; padding: 20px 25px; border: 1px solid #ccc; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ===== 表單區域 ===== -->
    <div class="form-panel">
        <h2>📝 填寫 PI 資料</h2>

        <!-- 基本資料 -->
        <div class="form-row">
            <div class="form-group">
                <label>訂單編號（自動生成）</label>
                <input type="text" id="orderNo" readonly>
            </div>
            <div class="form-group">
                <label>日期</label>
                <input type="text" id="dateVal" placeholder="2026年10月6日">
            </div>
            <div class="form-group">
                <label>貿易條款</label>
                <select id="tradeTerms">
                    <option value="DDP（雙清包稅到門）">DDP（雙清包稅到門）</option>
                    <option value="DDP（空運包稅到門）">DDP（空運包稅到門）</option>
                    <option value="DDP（海運包稅到門）">DDP（海運包稅到門）</option>
                    <option value="EXW 佛山（出廠價）">EXW 佛山（出廠價）</option>
                </select>
            </div>
            <div class="form-group">
                <label>運輸時效</label>
                <select id="shippingTime">
                    <option value="空運約15天">空運約15天</option>
                    <option value="海運約45天" selected>海運約45天</option>
                </select>
            </div>
        </div>

        <!-- 生產週期 & 木箱體積 -->
        <div class="form-row">
            <div class="form-group">
                <label>生產週期</label>
                <input type="text" id="leadTime" placeholder="收到款項後15-20天" value="收到款項後15-20天">
            </div>
            <div class="form-group">
                <label>木箱體積／重量</label>
                <input type="text" id="woodenCaseInfo" placeholder="2200×500×500mm · 60KG">
            </div>
        </div>

        <!-- 客戶資料 -->
        <div class="form-row">
            <div class="form-group">
                <label>客戶姓名</label>
                <input type="text" id="buyerName" placeholder="客戶姓名">
            </div>
            <div class="form-group">
                <label>客戶國家／城市</label>
                <input type="text" id="buyerCity" placeholder="例如：英國 · 倫敦">
            </div>
            <div class="form-group">
                <label>客戶信箱／電話</label>
                <input type="text" id="buyerContact" placeholder="信箱或電話">
            </div>
            <div class="form-group">
                <label>收貨地址</label>
                <input type="text" id="buyerAddress" placeholder="完整收貨地址">
            </div>
        </div>

        <!-- 付款方式 -->
        <div class="form-row">
            <div class="form-group">
                <label>付款方式</label>
                <select id="paymentMethod">
                    <option value="微信 / WeChat Pay">微信</option>
                    <option value="支付寶 / Alipay">支付寶</option>
                    <option value="國際公司帳號">國際公司帳號</option>
                </select>
            </div>
        </div>

        <!-- 匯率設定 -->
        <h3>💱 匯率設定（自動取得，可手動修改）</h3>
        <div id="rateStatus" class="rate-status loading">正在取得當天即時匯率...</div>
        <div class="form-row">
            <div class="form-group">
                <label>1 港幣 = ? 人民幣</label>
                <input type="number" id="rateHKD" value="0.8584" step="0.0001" min="0">
            </div>
            <div class="form-group">
                <label>1 美元 = ? 人民幣</label>
                <input type="number" id="rateUSD" value="6.7050" step="0.0001" min="0">
            </div>
            <div class="form-group">
                <label>1 英鎊 = ? 人民幣</label>
                <input type="number" id="rateGBP" value="8.8920" step="0.0001" min="0">
            </div>
        </div>

        <!-- 產品明細 -->
        <h3>📦 產品明細</h3>
        <div id="productCards"></div>
        <button class="btn btn-outline" onclick="addProductCard()" style="margin-top:6px;">+ 新增一項產品</button>

        <!-- 額外費用 -->
        <h3>💰 額外費用（可選）</h3>
        <div class="form-row">
            <div class="form-group">
                <label>木箱包裝費（人民幣）</label>
                <input type="number" id="woodenCase" placeholder="0" value="0" min="0">
            </div>
            <div class="form-group">
                <label>其他費用（人民幣）</label>
                <input type="number" id="otherFee" placeholder="0" value="0" min="0">
            </div>
            <div class="form-group">
                <label>折扣（人民幣）</label>
                <input type="number" id="discount" placeholder="0" value="0" min="0">
            </div>
        </div>

        <!-- 備註 -->
        <div class="form-row">
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>備註</label>
                <input type="text" id="remark" placeholder="例如：不足1㎡按1㎡計算">
            </div>
        </div>

        <!-- 按鈕 -->
        <div class="btn-group">
            <button class="btn btn-primary" onclick="generateQuote()">📄 生成 PI</button>
            <button class="btn btn-outline" onclick="window.print()" id="printBtn" style="display:none;">🖨️ 列印 / 另存為 PDF</button>
        </div>
    </div>

    <!-- ===== PI 輸出區域 ===== -->
    <div class="quote-output" id="quoteOutput"></div>

</div>

<script>
    let productIndex = 0;

    const COLOR_OPTIONS = [
        '白色',
        '灰色'
    ];

    const PRODUCT_TYPE_OPTIONS = [
        '防寵物紗窗',
        '入戶門紗門',
        '其他產品'
    ];

    // ===== 自動生成訂單編號（MB + 年月日時分）=====
    function generateOrderNo() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        const h = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        return `MB${y}${m}${d}${h}${min}`;
    }

    // ===== 自動取得即時匯率 =====
    async function fetchRates() {
        const statusEl = document.getElementById('rateStatus');
        try {
            statusEl.className = 'rate-status loading';
            statusEl.textContent = '正在取得當天即時匯率...';

            const res = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/cny.json');
            const data = await res.json();
            const rates = data.cny;

            const rateHKD = rates.hkd ? (1 / rates.hkd) : 0.8584;
            const rateUSD = rates.usd ? (1 / rates.usd) : 6.7050;
            const rateGBP = rates.gbp ? (1 / rates.gbp) : 8.8920;

            document.getElementById('rateHKD').value = rateHKD.toFixed(4);
            document.getElementById('rateUSD').value = rateUSD.toFixed(4);
            document.getElementById('rateGBP').value = rateGBP.toFixed(4);

            const now = new Date();
            const timeStr = now.toLocaleString('zh-TW', { hour12: false });
            statusEl.className = 'rate-status success';
            statusEl.textContent = `✅ 已取得即時匯率（${timeStr}）· 1 美元 ≈ ${rateUSD.toFixed(4)} 人民幣 · 1 英鎊 ≈ ${rateGBP.toFixed(4)} 人民幣 · 1 港幣 ≈ ${rateHKD.toFixed(4)} 人民幣`;
        } catch (e) {
            console.warn('匯率取得失敗，使用預設值', e);
            statusEl.className = 'rate-status fail';
            statusEl.textContent = '⚠️ 即時匯率取得失敗，已使用預設匯率，請手動確認。';
        }
    }

    function addProductCard() {
        const container = document.getElementById('productCards');
        const idx = productIndex++;
        const card = document.createElement('div');
        card.className = 'product-card';
        card.id = 'product-card-' + idx;

        let colorOptions = COLOR_OPTIONS.map(c => `<option value="${c}">${c}</option>`).join('');
        let typeOptions = PRODUCT_TYPE_OPTIONS.map(t => `<option value="${t}">${t}</option>`).join('');

        card.innerHTML = `
            <div class="card-header">
                <span class="card-title">產品 #${idx + 1}</span>
                <button class="btn btn-danger" onclick="removeProductCard(${idx})">刪除</button>
            </div>

            <div class="row">
                <div class="form-group" style="grid-column: span 2;">
                    <label>產品類型</label>
                    <select class="p-type">${typeOptions}</select>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>產品名稱</label>
                    <input type="text" class="p-name" placeholder="例如：折疊式紗門（單開）">
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>框顏色</label>
                    <select class="p-color">${colorOptions}</select>
                </div>
                <div class="form-group">
                    <label>開啟方式</label>
                    <select class="p-opening">
                        <option value="左單開">左單開</option>
                        <option value="右單開">右單開</option>
                        <option value="對開式">對開式</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>高度（mm）</label>
                    <input type="number" class="p-height" placeholder="" oninput="calcCard(${idx})">
                </div>
                <div class="form-group">
                    <label>寬度（mm）</label>
                    <input type="number" class="p-width" placeholder="" oninput="calcCard(${idx})">
                </div>
                <div class="form-group">
                    <label>數量</label>
                    <input type="number" class="p-qty" placeholder="1" value="1" min="1" oninput="calcCard(${idx})">
                </div>
                <div class="form-group">
                    <label>單價（元/㎡）</label>
                    <input type="number" class="p-unit" placeholder="" oninput="calcCard(${idx})">
                </div>
                <div class="form-group">
                    <label>金額</label>
                    <input type="text" class="p-amount" readonly style="background:#f4f7fc; font-weight:600; color:#0b1a33;">
                </div>
            </div>

            <div class="row">
                <div class="form-group" style="grid-column: span 2;">
                    <label>紗網／材質說明</label>
                    <input type="text" class="p-mesh" placeholder="例如：304#不鏽鋼防寵物絲網">
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>備註</label>
                    <input type="text" class="p-remark" placeholder="例如：含安裝五金配件">
                </div>
            </div>
        `;
        container.appendChild(card);
    }

    function removeProductCard(idx) {
        const card = document.getElementById('product-card-' + idx);
        if (card) card.remove();
    }

    function calcCard(idx) {
        const card = document.getElementById('product-card-' + idx);
        if (!card) return;
        const h = parseFloat(card.querySelector('.p-height').value) || 0;
        const w = parseFloat(card.querySelector('.p-width').value) || 0;
        const qty = parseFloat(card.querySelector('.p-qty').value) || 0;
        const unit = parseFloat(card.querySelector('.p-unit').value) || 0;

        const areaPerPc = (h / 1000) * (w / 1000);
        const billedAreaPerPc = areaPerPc < 1 ? 1 : areaPerPc;
        const amount = billedAreaPerPc * qty * unit;
        card.querySelector('.p-amount').value = amount ? amount.toFixed(2) : '';
    }

    function generateQuote() {
        const orderNo = document.getElementById('orderNo').value || '';
        const dateVal = document.getElementById('dateVal').value || '';
        const tradeTerms = document.getElementById('tradeTerms').value;
        const shippingTime = document.getElementById('shippingTime').value;
        const leadTime = document.getElementById('leadTime').value || '';
        const woodenCaseInfo = document.getElementById('woodenCaseInfo').value || '';
        const paymentMethod = document.getElementById('paymentMethod').value;
        const buyerName = document.getElementById('buyerName').value || '';
        const buyerCity = document.getElementById('buyerCity').value || '';
        const buyerContact = document.getElementById('buyerContact').value || '';
        const buyerAddress = document.getElementById('buyerAddress').value || '';
        const woodenCase = parseFloat(document.getElementById('woodenCase').value) || 0;
        const otherFee = parseFloat(document.getElementById('otherFee').value) || 0;
        const discount = parseFloat(document.getElementById('discount').value) || 0;
        const remark = document.getElementById('remark').value || '';

        const rateHKD = parseFloat(document.getElementById('rateHKD').value) || 0.8584;
        const rateUSD = parseFloat(document.getElementById('rateUSD').value) || 6.7050;
        const rateGBP = parseFloat(document.getElementById('rateGBP').value) || 8.8920;

        const cards = document.querySelectorAll('.product-card');
        const products = [];
        let productTotal = 0;

        cards.forEach(card => {
            const type = card.querySelector('.p-type').value;
            const name = card.querySelector('.p-name').value.trim();
            const color = card.querySelector('.p-color').value;
            const opening = card.querySelector('.p-opening').value;
            const h = parseFloat(card.querySelector('.p-height').value) || 0;
            const w = parseFloat(card.querySelector('.p-width').value) || 0;
            const qty = parseFloat(card.querySelector('.p-qty').value) || 0;
            const unit = parseFloat(card.querySelector('.p-unit').value) || 0;
            const mesh = card.querySelector('.p-mesh').value.trim();
            const pRemark = card.querySelector('.p-remark').value.trim();

            if (!name || !h || !w || !qty || !unit) return;

            const areaPerPc = (h / 1000) * (w / 1000);
            const billedAreaPerPc = areaPerPc < 1 ? 1 : areaPerPc;
            const amount = billedAreaPerPc * qty * unit;
            productTotal += amount;

            products.push({
                type, name, color, opening, h, w, qty,
                area: areaPerPc,
                billedArea: billedAreaPerPc,
                unit, amount, mesh, pRemark
            });
        });

        if (products.length === 0) {
            alert('請至少填寫一項完整的產品資料！');
            return;
        }

        const grandTotal = productTotal + woodenCase + otherFee - discount;

        const totalHKD = rateHKD > 0 ? (grandTotal / rateHKD) : 0;
        const totalUSD = rateUSD > 0 ? (grandTotal / rateUSD) : 0;
        const totalGBP = rateGBP > 0 ? (grandTotal / rateGBP) : 0;

        // ===== 動態設定頁面標題 = 客戶姓名 + 地區 + PI =====
        const titleName = buyerName || '客戶';
        const titleCity = buyerCity || '';
        document.title = `${titleName} ${titleCity} PI`.trim();

        let html = `
        <div class="brand-row">
            <div class="brand-left">
                <div class="brand-name">MBORMC 曼伯歐羅 <small>®</small></div>
                <div class="brand-tagline">全球紗窗品牌</div>
            </div>
            <div class="invoice-meta">
                <div><strong>發票編號</strong> ${orderNo}</div>
                <div><strong>日期</strong> ${dateVal}</div>
                <div><strong>貿易條款</strong> ${tradeTerms}</div>
            </div>
        </div>

        <div class="address-panel">
            <div class="address-box">
                <div class="label">賣方</div>
                <div class="content">
                    <strong>佛山市德鉑歐羅門窗有限公司</strong><br>
                    聯絡人：鄧金閃<br>
                    <span class="phone">WhatsApp：+86 135 3660 0067</span><br>
                    <span class="phone">微信：FSMBOR</span><br>
                    地址：中國廣東佛山南海區大瀝鎮<br>
                    網站：<a href="http://www.mbormc.com" target="_blank" class="web-link">www.mbormc.com</a>
                </div>
            </div>
            <div class="address-box">
                <div class="label">買方</div>
                <div class="content">
                    <strong>${buyerName || '—'}</strong><br>
                    ${buyerCity || ''}<br>
                    ${buyerContact ? buyerContact + '<br>' : ''}
                    ${buyerAddress ? buyerAddress : ''}
                </div>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>序號</th>
                        <th>產品類型</th>
                        <th style="text-align:left; padding-left:12px;">產品名稱</th>
                        <th>顏色</th>
                        <th>開啟方式</th>
                        <th>尺寸（mm）</th>
                        <th>面積（㎡）</th>
                        <th>數量</th>
                        <th>單價（元）</th>
                        <th>金額（元）</th>
                    </tr>
                </thead>
                <tbody>
        `;

        products.forEach((p, i) => {
            let nameCell = p.name;
            if (p.mesh) nameCell += `<span class="en-cell">${p.mesh}</span>`;
            if (p.pRemark) nameCell += `<span class="en-cell" style="color:#c0722a;">備註：${p.pRemark}</span>`;

            html += `
                <tr>
                    <td>${i + 1}</td>
                    <td>${p.type}</td>
                    <td class="text-left">${nameCell}</td>
                    <td>${p.color}</td>
                    <td>${p.opening}</td>
                    <td>${p.h} × ${p.w}</td>
                    <td>${p.billedArea.toFixed(2)}</td>
                    <td>${p.qty}</td>
                    <td>${p.unit}</td>
                    <td>${p.amount.toFixed(2)}</td>
                </tr>
            `;
        });

        if (woodenCase > 0) {
            html += `
                <tr class="bg-sub">
                    <td colspan="9" style="text-align:right; padding-right:20px; font-weight:600;">木箱包裝費</td>
                    <td>${woodenCase.toFixed(2)}</td>
                </tr>
            `;
        }
        if (otherFee > 0) {
            html += `
                <tr class="bg-sub">
                    <td colspan="9" style="text-align:right; padding-right:20px; font-weight:600;">其他費用</td>
                    <td>${otherFee.toFixed(2)}</td>
                </tr>
            `;
        }
        if (discount > 0) {
            html += `
                <tr class="bg-sub">
                    <td colspan="9" style="text-align:right; padding-right:20px; font-weight:600; color:#c0392b;">折扣優惠</td>
                    <td style="color:#c0392b;">-${discount.toFixed(2)}</td>
                </tr>
            `;
        }

        html += `
                    <tr class="bg-total">
                        <td colspan="9" style="text-align:right; font-size:15px; padding-right:20px;">✅ 合計</td>
                        <td style="font-size:20px; font-weight:700; color:#003d7a;">人民幣 ${grandTotal.toFixed(2)}</td>
                    </tr>
                </tbody>
            </table>
        </div>
        `;

        // ===== 多幣種顯示框 =====
        html += `
        <div class="currency-box">
            <div class="title">💱 多幣種參考報價</div>
            <div class="currency-grid">
                <div class="currency-item main">
                    <div class="c-label">人民幣</div>
                    <div class="c-value">¥ ${grandTotal.toFixed(2)}</div>
                </div>
                <div class="currency-item">
                    <div class="c-label">港幣</div>
                    <div class="c-value">HK$ ${totalHKD.toFixed(2)}</div>
                </div>
                <div class="currency-item">
                    <div class="c-label">美元</div>
                    <div class="c-value">$ ${totalUSD.toFixed(2)}</div>
                </div>
                <div class="currency-item">
                    <div class="c-label">英鎊</div>
                    <div class="c-value">£ ${totalGBP.toFixed(2)}</div>
                </div>
            </div>
            <div class="currency-note">
                ⚠️ <strong>匯率說明：</strong><br>
                以上外幣金額僅供參考，按本發票日期匯率折算。最終金額以付款當日銀行實際匯率為準。
            </div>
        </div>
        `;

        if (remark) {
            html += `
                <div style="background:#fff8e1; border:1px solid #ffc107; border-radius:10px; padding:12px 18px; margin:12px 0 8px; font-size:13px; color:#856404;">
                    📌 <strong>備註：</strong>${remark}
                </div>
            `;
        }

        html += `
        <div class="info-grid">
            <div class="info-item"><span class="tag">貿易條款</span><span>${tradeTerms}</span></div>
            <div class="info-item"><span class="tag">運輸時效</span><span>${shippingTime}</span></div>
            <div class="info-item"><span class="tag">生產週期</span><span>${leadTime}</span></div>
            <div class="info-item"><span class="tag">付款方式</span><span>${paymentMethod}</span></div>
            <div class="info-item"><span class="tag">結算幣種</span><span>人民幣（可接受港幣／美元／英鎊）</span></div>
            <div class="info-item"><span class="tag">交貨方式</span><span>含運費、關稅、VAT、派送到門（DDP）</span></div>
            <div class="info-item"><span class="tag">保修配件</span><span>1 年</span></div>
            ${woodenCaseInfo ? `<div class="info-item"><span class="tag">木箱體積</span><span>${woodenCaseInfo}</span></div>` : ''}
        </div>

        <div class="terms-box">
            <p style="margin-bottom:6px;">
                <strong>📌 付款條件</strong><br>
                100% 全款預付，收到款項後安排生產。本訂單為訂製產品，確認後不可取消或退貨。
            </p>
            <p style="margin-top:10px; padding-top:10px; border-top:1px dashed #b7cee8;">
                <strong>🚚 運輸備註</strong><br>
                DDP 包稅到門 — 包含運輸、清關、關稅、VAT、派送。收貨時無需支付任何額外費用。
            </p>
            <p style="margin-top:10px; padding-top:10px; border-top:1px dashed #b7cee8;">
                <strong>🛡️ 保險及破損保障</strong><br>
                1. 本訂單已含運輸保險。<br>
                2. 若貨物在運輸途中因運輸原因破損而無法使用，我司將免費重新生產受損產品，並承擔二次運輸費用。<br>
                3. 請於收貨時檢查，如有破損請 7 個工作日內拍照聯絡我們。
            </p>
        </div>

        <!-- ===== 資金來源與合規聲明（精簡版）===== -->
        <div class="compliance-box">
            <div class="box-title">⚠️ 資金來源與合規聲明</div>
            <div class="box-note">
                本條款為國際銀行及支付平台之標準合規要求，適用於所有跨境交易。如付款正常且資金來源合法，不影響訂單執行。
            </div>
            <p><strong>1.</strong> 買方保證支付本訂單之所有款項均來源於合法所得，不涉及任何非法活動（包括但不限於洗錢、詐騙、貪污、走私、恐怖融資等）。</p>
            <p><strong>2.</strong> 買方須以本人或本公司帳戶支付。如使用第三方代付，須提前告知並獲得賣方同意。</p>
            <p><strong>3.</strong> 如因買方資金來源或第三方代付導致賣方帳戶被凍結、資金被退回或限制使用，本訂單自動失效，賣方有權取消訂單；因買方原因造成賣方損失的，買方須承擔賠償責任。</p>
        </div>

        <div style="background:#f0f7ff; border:1px solid #b8d4e8; border-radius:10px; padding:14px 18px; margin:12px 0 8px; font-size:13.5px; color:#1a3c62;">
            <strong>💳 收款帳戶</strong><br>
            收款帳戶資訊將另行提供，請聯絡我們取得帳戶詳情。
        </div>

        <div style="background:#fff3cd; border:1px solid #ffc107; border-radius:10px; padding:12px 18px; margin:12px 0 8px; font-size:13px; color:#856404;">
            <strong>📝 匯款備註：</strong> ${buyerName || '[買方姓名]'} ${orderNo}
        </div>

        <div class="sign-row">
            <div class="sign-box">
                <div class="label">賣方簽名</div>
                <div class="name">鄧金閃</div>
                <div class="date">日期：${dateVal}</div>
            </div>
            <div class="sign-box" style="text-align:right;">
                <div class="label">買方簽名</div>
                <div class="name" style="border-bottom-color:#b0c8e0; min-width:140px;">________________</div>
                <div class="date">日期：___________</div>
            </div>
        </div>

        <div class="footer-note">
            本訂購單一式兩份，雙方各執一份，具有同等法律效力。
        </div>
        `;

        const output = document.getElementById('quoteOutput');
        output.innerHTML = html;
        output.classList.add('show');
        document.getElementById('printBtn').style.display = 'inline-flex';
        output.scrollIntoView({ behavior: 'smooth' });
    }

    // ===== 初始化 =====
    window.onload = function() {
        // 自動生成訂單編號
        const orderInput = document.getElementById('orderNo');
        if (orderInput) {
            orderInput.value = generateOrderNo();
        }

        addProductCard();
        addProductCard();

        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        document.getElementById('dateVal').value = `${y}年${m}月${d}日`;

        // 自動取得匯率
        fetchRates();

        // 即時更新頁面標題
        const buyerNameEl = document.getElementById('buyerName');
        const buyerCityEl = document.getElementById('buyerCity');
        function updateTitle() {
            const name = buyerNameEl.value.trim() || '客戶';
            const city = buyerCityEl.value.trim() || '';
            document.title = `${name} ${city} PI`.trim();
        }
        buyerNameEl.addEventListener('input', updateTitle);
        buyerCityEl.addEventListener('input', updateTitle);
    };
</script>
</body>
</html>
