<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="robots" content="noindex, nofollow">
    <title>PI 報價單生成器 · MBORMC 曼伯歐羅</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: #e6e9ef;
            font-family: 'Microsoft JhengHei', 'PingFang TC', 'Segoe UI', Arial, sans-serif;
            padding: 30px 20px;
            -webkit-text-size-adjust: 100%;
        }
        .container { max-width: 1300px; margin: 0 auto; }

        .form-panel {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            padding: 28px 32px;
            margin-bottom: 24px;
        }
        .form-panel h2 {
            font-size: 20px;
            color: #0b1a33;
            margin-bottom: 18px;
            border-bottom: 2px solid #1a2b4c;
            padding-bottom: 10px;
        }
        .form-panel h3 {
            font-size: 15px;
            color: #0b1a33;
            margin: 18px 0 8px;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px 20px;
            margin-bottom: 14px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: #5d708b;
            letter-spacing: 0.3px;
        }
        .form-group input, .form-group select {
            padding: 10px 12px;
            border: 1px solid #dce5ec;
            border-radius: 8px;
            font-size: 15px;
            color: #1b293b;
            transition: border 0.2s;
            font-family: inherit;
            width: 100%;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #1e5a8a;
            box-shadow: 0 0 0 3px rgba(30,90,138,0.1);
        }
        .form-group input[readonly] {
            background: #f4f7fc;
            color: #1e5a8a;
            font-weight: 600;
            cursor: not-allowed;
        }

        .product-card {
            background: #f8fafd;
            border: 1px solid #e3e9f2;
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 14px;
            position: relative;
        }
        .product-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .product-card .card-title {
            font-size: 14px;
            font-weight: 600;
            color: #1e5a8a;
        }
        .product-card .row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px 14px;
            margin-bottom: 8px;
        }
        .product-card .row:last-child { margin-bottom: 0; }
        .product-card .form-group label { font-size: 11px; }
        .product-card .form-group input,
        .product-card .form-group select { padding: 8px 10px; font-size: 14px; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            -webkit-appearance: none;
        }
        .btn-primary { background: #1e5a8a; color: white; }
        .btn-primary:hover { background: #0f3b5c; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-outline {
            background: white;
            border: 1.5px solid #1e5a8a;
            color: #1e5a8a;
        }
        .btn-outline:hover { background: #1e5a8a; color: white; }
        .btn-quote {
            background: white;
            border: 2px solid #b8860b;
            color: #b8860b;
        }
        .btn-quote:hover { background: #b8860b; color: white; }
        .btn-danger {
            background: #e74c3c;
            color: white;
            padding: 8px 14px;
            font-size: 13px;
            border-radius: 6px;
        }
        .btn-danger:hover { background: #c0392b; }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .rate-status {
            font-size: 12px;
            padding: 8px 14px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: inline-block;
            line-height: 1.6;
        }
        .rate-status.loading { background: #e3f2fd; color: #1565c0; }
        .rate-status.success { background: #e8f5e9; color: #2e7d32; }
        .rate-status.fail { background: #fff3e0; color: #e65100; }

        .quote-output {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            padding: 45px 50px;
            display: none;
        }
        .quote-output.show { display: block; }

        .quotation-output {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            padding: 45px 50px;
            display: none;
        }
        .quotation-output.show { display: block; }

        .quotation-title {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #b8860b;
        }
        .quotation-title h1 {
            font-size: 26px;
            font-weight: 700;
            color: #0b1a33;
            letter-spacing: 4px;
            margin-bottom: 6px;
        }
        .quotation-title .subtitle {
            font-size: 14px;
            color: #5d708b;
            letter-spacing: 2px;
        }

        .brand-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 3px solid #1a2b4c;
            padding-bottom: 16px;
            margin-bottom: 22px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .brand-left { display: flex; flex-direction: column; }
        .brand-name {
            font-size: 28px;
            font-weight: 700;
            color: #0b1a33;
            letter-spacing: 1px;
        }
        .brand-name small { font-weight: 400; font-size: 14px; color: #3d4f6a; margin-left: 10px; }
        .brand-tagline {
            font-size: 13px;
            color: #3d5a73;
            background: #eaf3ed;
            display: inline-block;
            padding: 2px 14px;
            border-radius: 30px;
            margin-top: 4px;
        }
        .invoice-meta {
            text-align: right;
            background: #f4f7fc;
            padding: 10px 18px;
            border-radius: 16px;
        }
        .invoice-meta div { font-size: 14px; color: #1f2a3f; line-height: 1.6; }
        .invoice-meta strong { font-weight: 600; color: #0b1a33; }

        .address-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 30px 40px;
            background: #f9fafc;
            padding: 18px 22px;
            border-radius: 18px;
            margin-bottom: 24px;
            border: 1px solid #e9edf4;
        }
        .address-box { flex: 1 1 200px; }
        .address-box .label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.8px;
            color: #5d708b;
            margin-bottom: 5px;
        }
        .address-box .content { font-size: 15px; line-height: 1.6; color: #1b293b; }
        .address-box .content .phone { font-weight: 500; color: #0f2b4f; }
        .web-link { color: #0059b3; text-decoration: none; border-bottom: 1px dotted #b3c9e0; }

        /* ===== 图片功能：表单里的预览 ===== */
        .p-image-preview { margin-top: 8px; }
        .p-image-preview .thumb {
            position: relative;
            display: inline-block;
            width: 90px;
            height: 90px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #dce5ec;
            background: #fff;
        }
        .p-image-preview .thumb img {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
        }
        .p-image-preview .thumb .del {
            position: absolute;
            top: 3px; right: 3px;
            width: 20px; height: 20px;
            border-radius: 50%;
            background: rgba(231,76,60,0.9);
            color: #fff;
            font-size: 13px;
            line-height: 20px;
            text-align: center;
            cursor: pointer;
            border: none;
            padding: 0;
        }

        /* ===== 卡片式产品区（报价单 / PI 输出用）===== */
        .product-list {
            margin: 18px 0 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .product-item {
            display: flex;
            gap: 20px;
            background: #f8fafd;
            border: 1px solid #e3e9f2;
            border-radius: 14px;
            padding: 18px 20px;
            page-break-inside: avoid;
            break-inside: avoid;
        }
        .product-item .pi-img {
            flex: 0 0 auto;
            width: 300px;
            height: 300px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #dce5ec;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .product-item .pi-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .product-item .pi-img.no-img {
            background: #f1f4f8;
            border: 1px dashed #c7d2e0;
            color: #9aa9bd;
            font-size: 14px;
            text-align: center;
            line-height: 1.6;
        }
        .product-item .pi-info {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .product-item .pi-title {
            font-size: 16px;
            font-weight: 700;
            color: #0b1a33;
            padding-bottom: 8px;
            border-bottom: 1px dashed #dbe4f0;
            line-height: 1.5;
        }
        .product-item .pi-title .pi-no {
            display: inline-block;
            background: #1a2b4c;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            padding: 2px 9px;
            border-radius: 20px;
            margin-right: 8px;
            vertical-align: middle;
            letter-spacing: 0.5px;
        }
        .product-item .pi-title .pi-type {
            display: block;
            font-size: 12px;
            font-weight: 400;
            color: #5d708b;
            margin-top: 3px;
        }
        .product-item .pi-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 24px;
            font-size: 13.5px;
            line-height: 1.65;
            color: #1b293b;
        }
        .product-item .pi-grid .pi-field {
            display: flex;
            gap: 6px;
            align-items: baseline;
        }
        .product-item .pi-grid .pi-field .k {
            color: #5d708b;
            flex: 0 0 auto;
            font-weight: 500;
        }
        .product-item .pi-grid .pi-field .v {
            color: #0b1a33;
            font-weight: 600;
            word-break: break-word;
        }
        .product-item .pi-grid .pi-field.full {
            grid-column: 1 / -1;
        }
        .product-item .pi-grid .pi-field .v.money {
            color: #b8860b;
            font-size: 15px;
            font-weight: 700;
        }
        .product-item .pi-grid .pi-field .v.amount {
            color: #003d7a;
            font-size: 16px;
            font-weight: 700;
        }
        .product-item .pi-grid .pi-note {
            font-size: 12px;
            color: #c0722a;
            grid-column: 1 / -1;
        }

        /* 汇总表（额外费用 + 合计）*/
        .summary-wrap {
            margin: 8px 0 20px;
            border-radius: 16px;
            border: 1px solid #e3e9f2;
            overflow: hidden;
        }
        .summary-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            background: white;
        }
        .summary-wrap td {
            padding: 10px 18px;
            border-bottom: 1px solid #eef2f8;
            text-align: right;
        }
        .summary-wrap td:last-child {
            width: 220px;
            text-align: right;
            font-weight: 600;
            color: #0b1a33;
        }
        .summary-wrap tr:last-child td { border-bottom: none; }
        .summary-wrap .row-total td {
            background: #e9eff9;
            font-weight: 700;
            font-size: 17px;
        }
        .summary-wrap .row-total td:last-child {
            font-size: 20px;
            color: #003d7a;
        }
        .summary-wrap .row-sub td { background: #f8f9fa; }
        .summary-wrap .row-sub.green td:last-child { color: #1a5e1a; }
        .summary-wrap .row-sub.red td:last-child { color: #c0392b; }
        .summary-wrap .row-sub.gold td:last-child { color: #b8860b; }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 30px;
            background: #f8fafd;
            padding: 18px 22px;
            border-radius: 18px;
            margin: 18px 0 16px;
            border: 1px solid #e6ecf5;
        }
        .info-item { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-size: 14px; line-height: 1.6; }
        .info-item .tag { font-weight: 600; color: #26436a; min-width: 140px; }

        .currency-box {
            background: #f0f7ff;
            border: 2px solid #b8d4e8;
            border-radius: 16px;
            padding: 20px 24px;
            margin: 18px 0;
        }
        .currency-box .title {
            font-size: 15px;
            font-weight: 700;
            color: #003d7a;
            margin-bottom: 14px;
            letter-spacing: 0.5px;
        }
        .currency-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px 24px;
        }
        .currency-item {
            background: #ffffff;
            border: 1px solid #dce9f5;
            border-radius: 12px;
            padding: 12px 16px;
            text-align: center;
        }
        .currency-item .c-label {
            font-size: 12px;
            color: #5d708b;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .currency-item .c-value {
            font-size: 20px;
            font-weight: 700;
            color: #003d7a;
        }
        .currency-item.main .c-value {
            color: #b8860b;
            font-size: 22px;
        }
        .currency-note {
            margin-top: 14px;
            font-size: 12px;
            color: #856404;
            background: #fff8e1;
            border: 1px solid #ffc107;
            border-radius: 10px;
            padding: 10px 14px;
            line-height: 1.7;
        }

        .terms-box {
            background: #f2f6fe;
            border-left: 5px solid #1a2b4c;
            padding: 16px 22px;
            border-radius: 14px;
            margin: 20px 0 16px;
            font-size: 14px;
            line-height: 1.8;
            color: #0f263f;
        }
        .terms-box strong { color: #002856; }
        .terms-box .en-term { font-size: 12.5px; color: #4f6a8a; display: block; margin-top: 3px; font-weight: 400; }

        .compliance-box {
            background: #fff5f5;
            border: 2px solid #e74c3c;
            border-radius: 14px;
            padding: 14px 20px;
            margin: 18px 0 14px;
            font-size: 12.5px;
            line-height: 1.8;
            color: #7a1f1f;
        }
        .compliance-box .box-title {
            font-size: 14px;
            font-weight: 700;
            color: #c0392b;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }
        .compliance-box .box-note {
            background: #fff0f0;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 10px;
            font-size: 12px;
            color: #a05252;
            line-height: 1.7;
        }
        .compliance-box p { margin-bottom: 6px; }

        .sign-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            margin: 28px 0 10px;
            padding-top: 12px;
            border-top: 2px solid #dfe7f2;
            gap: 16px;
        }
        .sign-box { min-width: 180px; padding: 6px 0; flex: 1 1 200px; }
        .sign-box .label { font-size: 13px; color: #475e7c; font-weight: 500; }
        .sign-box .name { font-size: 18px; font-weight: 600; color: #0b1a33; margin-top: 4px; border-bottom: 1px solid #bacfe0; padding-bottom: 6px; display: inline-block; }
        .sign-box .date { font-size: 14px; color: #2e4a6b; margin-top: 8px; }

        .footer-note {
            text-align: center;
            font-size: 13px;
            color: #4f688b;
            margin-top: 18px;
            border-top: 1px solid #e2eaf5;
            padding-top: 16px;
        }

        .payment-account-box {
            background: #f0f7ff;
            border: 1px solid #b8d4e8;
            border-radius: 12px;
            padding: 18px 22px;
            margin: 12px 0 8px;
            font-size: 13.5px;
            color: #1a3c62;
            line-height: 1.7;
        }
        .payment-account-box .box-title {
            font-size: 15px;
            font-weight: 700;
            color: #003d7a;
            margin-bottom: 6px;
        }
        .payment-account-box .box-sub {
            font-size: 13px;
            color: #2f4f74;
            margin-bottom: 14px;
        }
        .channel-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }
        .badge {
            display: inline-flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            border: 1.5px solid;
            background: #ffffff;
            min-width: 220px;
        }
        .badge svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .badge .badge-title { font-size: 13.5px; font-weight: 700; display: block; }
        .badge .badge-note { font-size: 11.5px; font-weight: 400; color: #6b7a8d; display: block; margin-top: 3px; line-height: 1.5; }
        .badge-wechat { border-color: #4caf50; color: #2e7d32; }
        .badge-alipay { border-color: #2196f3; color: #1565c0; }
        .badge-pingpong { border-color: #ff9800; color: #e65100; }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            body { padding: 12px 8px; }
            .container { max-width: 100%; }
            .form-panel { padding: 18px 16px; border-radius: 14px; margin-bottom: 14px; }
            .form-panel h2 { font-size: 17px; }
            .form-panel h3 { font-size: 14px; }
            .form-row { grid-template-columns: 1fr; gap: 10px; }
            .form-group label { font-size: 12px; }
            .form-group input, .form-group select { font-size: 16px; padding: 10px 12px; }
            .product-card { padding: 14px 12px; border-radius: 10px; }
            .product-card .row { grid-template-columns: 1fr 1fr; gap: 8px; }
            .product-card .card-title { font-size: 13px; }
            .btn { padding: 12px 18px; font-size: 14px; }
            .btn-group { flex-direction: column; }
            .btn-group .btn { width: 100%; }
            .quote-output, .quotation-output { padding: 20px 14px; border-radius: 14px; }
            .quotation-title h1 { font-size: 20px; letter-spacing: 2px; }
            .quotation-title .subtitle { font-size: 12px; }
            .brand-row { flex-direction: column; align-items: stretch; gap: 10px; }
            .brand-name { font-size: 22px; }
            .invoice-meta { text-align: left; width: 100%; }
            .address-panel { flex-direction: column; gap: 16px; padding: 14px 16px; }
            .address-box .content { font-size: 14px; }
            .info-grid { grid-template-columns: 1fr; gap: 10px; padding: 14px 16px; }
            .info-item { font-size: 13px; }
            .info-item .tag { min-width: 100px; font-size: 12px; }
            .currency-box { padding: 14px 16px; }
            .currency-box .title { font-size: 14px; }
            .currency-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .currency-item { padding: 10px 8px; }
            .currency-item .c-value { font-size: 16px; }
            .currency-item.main .c-value { font-size: 18px; }
            .terms-box { padding: 14px 16px; font-size: 13px; }
            .compliance-box { padding: 12px 14px; font-size: 12px; }
            .compliance-box .box-title { font-size: 13px; }
            .sign-row { flex-direction: column; gap: 14px; }
            .sign-box { width: 100%; }
            .sign-box .name { font-size: 16px; }
            .payment-account-box { padding: 14px 16px; }
            .channel-badges { flex-direction: column; gap: 8px; }
            .badge { min-width: 100%; }
            /* 产品卡片在手机上改成竖排 */
            .product-item { flex-direction: column; gap: 14px; padding: 14px; }
            .product-item .pi-img { width: 100%; height: auto; aspect-ratio: 1 / 1; max-width: 300px; margin: 0 auto; }
            .product-item .pi-grid { grid-template-columns: 1fr; gap: 6px; }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .form-row { grid-template-columns: repeat(2, 1fr); }
            .product-card .row { grid-template-columns: repeat(2, 1fr); }
        }

        /* ===== 打印 ===== */
        @media print {
            body { background: white; padding: 0; }
            .form-panel { display: none !important; }
            .quote-output.active,
            .quotation-output.active {
                display: block !important;
                box-shadow: none;
                padding: 15px 20px;
                border: none;
                border-radius: 0;
                margin: 0;
                width: 100%;
                max-width: 100%;
            }
            .quote-output:not(.active),
            .quotation-output:not(.active) {
                display: none !important;
            }
            .product-item {
                page-break-inside: avoid;
                break-inside: avoid;
                box-shadow: none;
            }
            .product-item .pi-img {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .brand-row, .address-panel, .terms-box, .compliance-box, .sign-row, .payment-account-box, .quotation-title { page-break-inside: avoid; }
            * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            @page { 
                margin: 8mm; 
                size: A4 landscape;
            }
            .sign-row {
                display: flex;
                flex-wrap: nowrap;
                justify-content: space-between;
                gap: 40px;
            }
            .sign-box { flex: 1 1 45%; }
        }

        @media (max-width: 420px) {
            .form-panel { padding: 14px 12px; }
            .form-panel h2 { font-size: 16px; }
            .product-card .row { grid-template-columns: 1fr; }
            .currency-grid { grid-template-columns: 1fr; }
            .brand-name { font-size: 20px; }
            .info-item .tag { min-width: 80px; }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="form-panel">
        <h2>📝 填寫資料 / Fill Information</h2>

        <div class="form-row">
            <div class="form-group">
                <label>單號（自動生成）/ No.（Auto）</label>
                <input type="text" id="orderNo" readonly>
            </div>
            <div class="form-group">
                <label>日期 / Date</label>
                <input type="text" id="dateVal">
            </div>
            <div class="form-group">
                <label>貿易條款 / Trade Terms</label>
                <select id="tradeTerms">
                    <option value="DDP（雙清包稅到門）/ DDP (All-Inclusive)">DDP（雙清包稅到門）</option>
                    <option value="DDP 空運（包稅到門）/ DDP Air Freight">DDP 空運（包稅到門）</option>
                    <option value="DDP 海運（包稅到門）/ DDP Sea Freight">DDP 海運（包稅到門）</option>
                    <option value="EXW 佛山（出廠價）/ EXW Foshan">EXW 佛山（出廠價）</option>
                </select>
            </div>
            <div class="form-group">
                <label>運輸時效 / Shipping Time</label>
                <select id="shippingTime">
                    <option value="空運約15天 / Air approx. 15 days">空運約15天</option>
                    <option value="海運約45天 / Sea approx. 45 days" selected>海運約45天</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>生產週期 / Lead Time</label>
                <input type="text" id="leadTime" value="收到款項後15-20天 / 15-20 days after payment">
            </div>
            <div class="form-group">
                <label>木箱體積／重量 / Wooden Case Size & Weight</label>
                <input type="text" id="woodenCaseInfo">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>客戶姓名 / Buyer Name</label>
                <input type="text" id="buyerName">
            </div>
            <div class="form-group">
                <label>客戶國家／城市 / Country & City</label>
                <input type="text" id="buyerCity">
            </div>
            <div class="form-group">
                <label>客戶信箱／電話 / Contact</label>
                <input type="text" id="buyerContact">
            </div>
            <div class="form-group">
                <label>收貨地址 / Delivery Address</label>
                <input type="text" id="buyerAddress">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>公司名稱（可選）/ Company Name (Optional)</label>
                <input type="text" id="buyerCompany" placeholder="個人客戶可留空 / Leave blank for individual">
            </div>
            <div class="form-group">
                <label>公司稅號 / VAT Number（可選）</label>
                <input type="text" id="buyerVAT" placeholder="個人客戶可留空 / Leave blank for individual">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>付款方式（結構）/ Payment Structure</label>
                <select id="paymentStructure">
                    <option value="A|100% 全款預付">A：100% 全款預付 / 100% Full Payment</option>
                    <option value="B|70% 定金 + 30% 尾款">B：70% 定金 + 30% 尾款 / 70% Deposit + 30% Balance</option>
                    <option value="C|50% 定金 + 50% 尾款">C：50% 定金 + 50% 尾款 / 50% Deposit + 50% Balance</option>
                </select>
            </div>
        </div>

        <h3>💱 匯率設定（自動取得，可手動修改）/ Exchange Rate Settings</h3>
        <div id="rateStatus" class="rate-status loading">正在取得當天即時匯率... / Fetching live rates...</div>
        <div class="form-row">
            <div class="form-group">
                <label>1 港幣 = ? 人民幣 / 1 HKD = ? CNY</label>
                <input type="number" id="rateHKD" value="0.8584" step="0.0001" min="0">
            </div>
            <div class="form-group">
                <label>1 美元 = ? 人民幣 / 1 USD = ? CNY</label>
                <input type="number" id="rateUSD" value="6.7050" step="0.0001" min="0">
            </div>
            <div class="form-group">
                <label>1 英鎊 = ? 人民幣 / 1 GBP = ? CNY</label>
                <input type="number" id="rateGBP" value="8.8920" step="0.0001" min="0">
            </div>
        </div>

        <h3>📦 產品明細 / Product Details</h3>
        <div id="productCards"></div>
        <button class="btn btn-outline" onclick="addProductCard()" style="margin-top:6px;">+ 新增一項產品 / Add Product</button>

        <h3>💰 額外費用（可選）/ Additional Charges (Optional)</h3>
        <div class="form-row">
            <div class="form-group">
                <label>木箱包裝費（人民幣）/ Wooden Case (RMB)</label>
                <input type="number" id="woodenCase" placeholder="0" value="0" min="0">
            </div>
            <div class="form-group">
                <label>運費保險（人民幣，自定義金額）/ Freight Insurance (RMB)</label>
                <input type="number" id="freightInsurance" placeholder="0" value="0" min="0">
            </div>
            <div class="form-group">
                <label>其他費用（人民幣）/ Other Charges (RMB)</label>
                <input type="number" id="otherFee" placeholder="0" value="0" min="0">
            </div>
            <div class="form-group">
                <label>折扣（人民幣）/ Discount (RMB)</label>
                <input type="number" id="discount" placeholder="0" value="0" min="0">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>備註 / Remark</label>
                <input type="text" id="remark">
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-quote" onclick="generateQuote('quote')">📋 生成報價單（繁體中文）</button>
            <button class="btn btn-primary" onclick="generateQuote('both')">📄 生成正式 PI（繁體 + English）</button>
            <button class="btn btn-outline" onclick="window.print()" id="printBtn" style="display:none;">🖨️ 列印 / 另存為 PDF</button>
        </div>
    </div>

    <div class="quote-output" id="quoteOutput"></div>
    <div class="quotation-output" id="quotationOutput"></div>

</div>
    <div class="quote-output" id="quoteOutput"></div>
    <div class="quotation-output" id="quotationOutput"></div>

</div>
